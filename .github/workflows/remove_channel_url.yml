name: Remove Channel URL

on:
  workflow_dispatch:
    inputs:
      tvgId:
        description: "tvg-id of the channel"
        required: true
        type: string
      url:
        description: "Exact stream URL to remove"
        required: true
        type: string

permissions:
  contents: write

jobs:
  remove-channel-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout Data Branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Run Remove Channel URL Script
        env:
          TVG_ID: ${{ github.event.inputs.tvgId }}
          URL: ${{ github.event.inputs.url }}
          PYTHONPATH: ${{ github.workspace }}
        run: python playlists/remove_channel_url.py

      - name: Commit and Push to Data Branch
        run: |
          cd data
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add /channels
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit --amend -m "Automated data: Updated channels.json at $TIMESTAMP"
            git push --force origin data
          else
            echo "No channels.json changes detected. Skipping commit."
          fi
