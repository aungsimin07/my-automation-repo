name: Resume Pending Fixtures

on:
  schedule:
    # Runs hourly at minute 15 (e.g. 01:15, 02:15 UTC) to clear any remaining queue
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resume-fixtures-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout Data Branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Resume Fixtures Script
        run: |
          python scripts/resume_fixtures.py

      - name: Commit and Force-Push Updates
        run: |
          cd data
          
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add fixtures.json task_queue.json
          
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit --amend -m "Automated data: Queue swept at $TIMESTAMP"
            git push --force origin data
          else
            echo "No queue changes or new fixtures fetched. Skipping commit."
          fi
