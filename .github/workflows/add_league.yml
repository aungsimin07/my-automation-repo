name: Add League

on:
  workflow_dispatch:
    inputs:
      leagueUrl:
        description: "League home page URL (e.g. https://www.thesportsdb.com/league/4328-english-premier-league)"
        required: true
        type: string
      leagueLogoId:
        description: "Fotmob league logo id (integer, optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  add-league:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout Data Branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Add League Script
        id: add-league
        env:
          THESPORTSDB_BASE_URL: ${{ secrets.THESPORTSDB_BASE_URL }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          LEAGUE_URL: ${{ github.event.inputs.leagueUrl }}
          LEAGUE_LOGO_ID: ${{ github.event.inputs.leagueLogoId }}
        run: python scripts/add_league.py

      - name: Sync Events for New League
        env:
          THESPORTSDB_BASE_URL: ${{ secrets.THESPORTSDB_BASE_URL }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          MAX_RUNTIME_SECONDS: "240"
          SKIP_COMPLETE_LEAGUES: ${{ vars.SKIP_COMPLETE_LEAGUES }}
          ONLY_LEAGUE_ID: ${{ steps.add-league.outputs.idLeague }}
        run: python scripts/fetch_events.py

      - name: Commit and Push to Data Branch
        run: |
          cd data
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add leagues.json events.json queues/
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit --amend -m "Automated data: Updated leagues.json and events.json at $TIMESTAMP"
            git push --force origin data
          else
            echo "No changes detected. Skipping commit."
          fi