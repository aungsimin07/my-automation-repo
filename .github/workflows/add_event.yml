name: Add Event

on:
  workflow_dispatch:
    inputs:
      eventId:
        description: "TheSportsDB event id (e.g. 441613)"
        required: true
        type: string
      leagueLogoId:
        description: "Fotmob league logo id (integer, optional — only used if the event's league is untracked)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  add-event:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout Data Branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Add Event Script
        env:
          THESPORTSDB_BASE_URL: ${{ secrets.THESPORTSDB_BASE_URL }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          EVENT_ID: ${{ github.event.inputs.eventId }}
          LEAGUE_LOGO_ID: ${{ github.event.inputs.leagueLogoId }}
        run: python scripts/add_event.py

      - name: Commit and Push to Data Branch
        run: |
          cd data
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add events.json
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit --amend -m "Automated data: Updated events.json at $TIMESTAMP"
            git push --force origin data
          else
            echo "No events.json changes detected. Skipping commit."
          fi