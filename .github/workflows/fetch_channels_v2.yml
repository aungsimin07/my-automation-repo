name: Fetch Channels V2

on:
  workflow_dispatch:
  repository_dispatch:
    types: [fetch-channels-v2]

permissions:
  contents: write

jobs:
  fetch-channels-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout Data Branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Fetch Channels V2 Script
        env:
          PLAYLIST_URLV2: ${{ secrets.PLAYLIST_URLV2 }}
          DEFAULT_HTTP_USER_AGENT: ${{ vars.DEFAULT_HTTP_USER_AGENT }}
          PYTHONPATH: ${{ github.workspace }}
        run: python playlists/fetch_channels_v2.py

      - name: Commit and Push to Data Branch
        run: |
          cd data
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add channels_v2.json channel_tvgid_map.json
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit --amend -m "Automated data: Updated channels_v2.json at $TIMESTAMP"
            git push --force origin data
          else
            echo "No channels_v2.json changes detected. Skipping commit."
          fi