name: Remove TVG IDs

on:
  workflow_dispatch:
    inputs:
      playlistId:
        description: "Playlist id to remove tvg-id(s) from"
        required: true
        type: string
      tvgIds:
        description: "Comma-separated tvg-id(s) to remove"
        required: true
        type: string

permissions:
  contents: write

jobs:
  remove-tvgids:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout Data Branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Run Remove TVG IDs Script
        env:
          PLAYLIST_ID: ${{ github.event.inputs.playlistId }}
          TVG_IDS: ${{ github.event.inputs.tvgIds }}
          PYTHONPATH: ${{ github.workspace }}
        run: python playlists/remove_tvgids.py

      - name: Commit and Push to Data Branch
        run: |
          cd data
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlists.json
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit --amend -m "Automated data: Updated playlists.json at $TIMESTAMP"
            git push --force origin data
          else
            echo "No playlists.json changes detected. Skipping commit."
          fi
