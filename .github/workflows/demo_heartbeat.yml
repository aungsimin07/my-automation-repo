name: Demo Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  repository_dispatch:
    types: [heartbeat]

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Run Demo Heartbeat Script
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/demo_heartbeat.py