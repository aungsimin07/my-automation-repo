name: Remove Event

on:
  workflow_dispatch:
    inputs:
      eventId:
        description: "TheSportsDB event id to remove (e.g. 2513946)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  remove-event:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout Data Branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Remove Event Script
        env:
          EVENT_ID: ${{ github.event.inputs.eventId }}
        run: python scripts/remove_event.py

      - name: Commit and Push to Data Branch
        run: |
          cd data
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add events.json
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit --amend -m "Automated data: Updated events.json at $TIMESTAMP"
            git push --force origin data
          else
            echo "No events.json changes detected. Skipping commit."
          fi