name: Sync Fixtures

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  schedule:
    # Runs automatically at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      targetDate:
        description: 'Target Date (YYYY-MM-DD). Leave empty to default to today.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  sync-fixtures-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout Data Branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Fetch Fixtures Script
        run: |
          if [ -n "${{ inputs.targetDate }}" ]; then
            python scripts/fetch_fixtures.py --date "${{ inputs.targetDate }}"
          else
            python scripts/fetch_fixtures.py
          fi

      - name: Commit and Force-Push to Data Branch
        run: |
          cd data
          
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Added task_queue.json to the staging area
          git add fixtures.json task_queue.json
          
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit --amend -m "Automated data: Fixtures synced at $TIMESTAMP"
            git push --force origin data
          else
            echo "No changes in fixtures or task queue for this date range. Skipping commit."
          fi
