name: Add Channel URL

on:
  workflow_dispatch:
    inputs:
      tvgId:
        description: "tvg-id of the channel (e.g. Spiler1.hu@SD)"
        required: true
        type: string
      url:
        description: "Stream URL (.m3u8)"
        required: true
        type: string
      displayName:
        description: "Display name (required only if this tvg-id doesn't exist yet)"
        required: false
        type: string
      provider:
        description: "Source label (optional, defaults to 'manual')"
        required: false
        type: string
      priority:
        description: "Failover priority, lower = higher (optional, default 0)"
        required: false
        type: string
      quality:
        description: "e.g. 1080p, HD (optional)"
        required: false
        type: string
      format:
        description: "Stream format (optional, default 'hls')"
        required: false
        type: string
      httpUserAgent:
        description: "Custom User-Agent for this URL (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  add-channel-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout Data Branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Run Add Channel URL Script
        env:
          TVG_ID: ${{ github.event.inputs.tvgId }}
          URL: ${{ github.event.inputs.url }}
          DISPLAY_NAME: ${{ github.event.inputs.displayName }}
          PROVIDER: ${{ github.event.inputs.provider }}
          PRIORITY: ${{ github.event.inputs.priority }}
          QUALITY: ${{ github.event.inputs.quality }}
          FORMAT: ${{ github.event.inputs.format }}
          HTTP_USER_AGENT: ${{ github.event.inputs.httpUserAgent }}
          PYTHONPATH: ${{ github.workspace }}
        run: python playlists/add_channel_url.py

      - name: Commit and Push to Data Branch
        run: |
          cd data
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add /channels
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit --amend -m "Automated data: Updated channels.json at $TIMESTAMP"
            git push --force origin data
          else
            echo "No channels.json changes detected. Skipping commit."
          fi
