name: Migrate Channel Links (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout Data Branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Run Migration Script
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/migrate_channel_links.py

      - name: Commit and Push to Data Branch
        run: |
          cd data
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add events.json
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit --amend -m "Automated data: Migrated event channel links to tvg-id scheme at $TIMESTAMP"
            git push --force origin data
          else
            echo "No events.json changes detected. Skipping commit."
          fi