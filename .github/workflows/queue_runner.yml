name: Queue Runner

on:
  workflow_dispatch:
  repository_dispatch:
    types: [queue-runner]

permissions:
  contents: write

jobs:
  run-queues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Checkout Data Branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Queue Runner Script
        env:
          THESPORTSDB_BASE_URL: ${{ secrets.THESPORTSDB_BASE_URL }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          MAX_RUNTIME_SECONDS: "240"
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/queue_runner.py

      - name: Commit and Push to Data Branch
        run: |
          cd data
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add leagues.json events.json sync_state.json queues/
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit --amend -m "Automated data: Processed queues at $TIMESTAMP"
            git push --force origin data
          else
            echo "No changes detected. Skipping commit."
          fi